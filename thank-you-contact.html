
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - EZB Services</title>
    <link rel="stylesheet" href="style.css"> <!-- Links to your main stylesheet -->
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .thank-you-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .thank-you-card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background-color: #e6f4ea;
            color: #137333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 25px auto;
        }
        .thank-you-card h1 {
            color: #1a1a1a;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .thank-you-card p {
            color: #555555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .next-steps-box {
            background: #fdf8f5;
            border-left: 4px solid #f39c12;
            padding: 20px;
            text-align: left;
            border-radius: 4px;
            margin-bottom: 30px;
        }
        .next-steps-box h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 16px;
        }
        .next-steps-box ul {
            margin: 0;
            padding-left: 20px;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn-home {
            display: inline-block;
            background-color: #f39c12;
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn-home:hover {
            background-color: #d9822b;
        }
    </style>
</head>
<body>

    <div class="thank-you-wrapper">
        <div class="thank-you-card">
            <div class="success-icon">✓</div>
            <h1>Thank You!</h1>
            <p>Thank you for contacting EZB Services. We've received your message and will get back to you as soon as possible.</p>

            <a href="index.html" class="btn-home">Return to Home</a>
        </div>
    </div>

</body>
</html>
